<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Patient — SecureHealth</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background:#d4e7f3; color:#e2e8f0; font-family:'Segoe UI',sans-serif; }
    .navbar { background:#1e293b !important; border-bottom:1px solid #334155; }
    .navbar-brand { color:#38bdf8 !important; font-weight:600; }
    .card { background:#1e293b; border:1px solid #334155; border-radius:14px; }
    label { color:#94a3b8; font-size:0.82rem; margin-bottom:4px; }
    .form-control, .form-select {
      background:#0f172a; border:1px solid #334155; color:#e2e8f0; font-size:0.88rem;
    }
    .form-control:focus, .form-select:focus {
      background:#0f172a; color:#e2e8f0; border-color:#38bdf8; box-shadow:none;
    }
    .form-control::placeholder { color:#475569; }
    .form-select option { background:#1e293b; }
  </style>
</head>
<body>

<nav class="navbar navbar-dark">
  <div class="container-fluid px-4">
    <span class="navbar-brand">🏥 SecureHealth — Add Patient</span>
    <a href="/" class="btn btn-sm btn-outline-secondary">← Back to Dashboard</a>
  </div>
</nav>

<div class="container mt-4" style="max-width:700px">
  <div class="card p-4">
    <h5 class="mb-1" style="color:#38bdf8">➕ New Patient Record</h5>
    <p class="text-muted mb-4" style="font-size:0.83rem">Saved to KMS-encrypted DynamoDB + S3 audit backup</p>

    <form method="POST">
      <div class="row g-3">
        <div class="col-12">
          <label>Full Name *</label>
          <input type="text" name="name" class="form-control" placeholder="e.g. Rajesh Verma" required>
        </div>
        <div class="col-md-4">
          <label>Age *</label>
          <input type="number" name="age" class="form-control" placeholder="e.g. 45" required>
        </div>
        <div class="col-md-4">
          <label>Gender</label>
          <select name="gender" class="form-select">
            <option>Male</option><option>Female</option><option>Other</option>
          </select>
        </div>
        <div class="col-md-4">
          <label>Blood Group</label>
          <select name="blood_group" class="form-select">
            <option>A+</option><option>A-</option><option>B+</option><option>B-</option>
            <option>AB+</option><option>AB-</option><option>O+</option><option>O-</option>
          </select>
        </div>
        <div class="col-md-6">
          <label>Phone</label>
          <input type="text" name="phone" class="form-control" placeholder="10-digit number">
        </div>
        <div class="col-md-6">
          <label>Status</label>
          <select name="status" class="form-select">
            <option>Stable</option><option>Recovering</option><option>Critical</option>
          </select>
        </div>
        <div class="col-12">
          <label>Diagnosis *</label>
          <input type="text" name="diagnosis" class="form-control" placeholder="e.g. Hypertension" required>
        </div>
        <div class="col-12">
          <label>Assigned Doctor</label>
          <input type="text" name="doctor" class="form-control" placeholder="e.g. Dr. Priya Sharma">
        </div>
        <div class="col-md-6">
          <label>Symptoms</label>
          <textarea name="symptoms" class="form-control" rows="3" placeholder="e.g. Chest pain, fatigue"></textarea>
        </div>
        <div class="col-md-6">
          <label>Medication</label>
          <textarea name="medication" class="form-control" rows="3" placeholder="e.g. Aspirin 75mg"></textarea>
        </div>
        <div class="col-12 d-flex gap-2 mt-2">
          <button type="submit" class="btn btn-primary">💾 Save Patient Record</button>
          <a href="/" class="btn btn-secondary">Cancel</a>
        </div>
      </div>
    </form>
  </div>
</div>
</body>
</html>
